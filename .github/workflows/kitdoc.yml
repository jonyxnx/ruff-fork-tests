name: Kitdoc Docs

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base commit SHA (defaults to HEAD~1)"
        required: false
      head_sha:
        description: "Head commit SHA (defaults to HEAD)"
        required: false
  push:
    branches:
      - main

permissions:
  contents: read

env:
  KITDOC_REPOSITORY: jonyxnx/hackathon-fintual
  KITDOC_REF: main
  LLM_PROVIDER: openai

jobs:
  notion-docs:
    name: Document repo with kitdoc
    runs-on: ubuntu-latest
    environment: main

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve base / head SHAs
        id: shas
        shell: bash
        run: |
          BASE="${{ github.event.inputs.base_sha || github.event.before }}"
          HEAD="${{ github.event.inputs.head_sha || github.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse "${HEAD}^" 2>/dev/null || echo "$HEAD")
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "Using base=$BASE head=$HEAD"

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.shas.outputs.head }}
          path: target-repo
          fetch-depth: 0

      - name: Checkout kitdoc
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KITDOC_REPOSITORY }}
          ref: ${{ env.KITDOC_REF }}
          path: kitdoc
          fetch-depth: 1

      - name: Install kitdoc dependencies
        working-directory: kitdoc
        run: npm ci

      - name: Generate and sync Notion docs
        working-directory: kitdoc
        env:
          TARGET_DIR: ${{ github.workspace }}/target-repo
        run: |
          npm run kitdoc -- \
            --dir "$TARGET_DIR" \
            --base "${{ steps.shas.outputs.base }}" \
            --head "${{ steps.shas.outputs.head }}" \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --provider openai \
            --depth 2
